<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>LittleWorld — Replay</title>
  <link rel="stylesheet" href="./styles.css?v=replay-20260828" />
  <link rel="stylesheet" href="./replay.css?v=replay-20260828" />
</head>
<body>
  <div id="app">
    <div id="hud">
      <div class="title">LittleWorld — Replay</div>
      <div class="hint">空白鍵播放／暫停 · 拖曳地圖移動 · 滾輪縮放 · 這個頁面不連任何模型</div>
      <div id="status">正在載入錄影…</div>
    </div>
    <div id="zoom-controls" aria-label="地圖縮放控制">
      <button id="zoom-in" type="button" aria-label="放大">＋</button>
      <button id="zoom-out" type="button" aria-label="縮小">−</button>
      <button id="zoom-reset" type="button" aria-label="重設縮放">Fit</button>
      <button id="toggle-debug" type="button" aria-pressed="false" aria-label="切換 world spec 疊圖">層</button>
    </div>
    <div id="game"></div>
    <div id="subtitle" aria-live="polite"></div>
    <div id="transport" aria-label="播放控制">
      <button id="play" type="button" aria-label="播放或暫停">▶</button>
      <button id="restart" type="button" aria-label="從頭播放">↺</button>
      <input id="scrub" type="range" min="0" max="1000" value="0" step="1" aria-label="時間軸" />
      <span id="clock">0:00 / 0:00</span>
      <label id="speed-label" for="speed">速度</label>
      <select id="speed" aria-label="播放速度">
        <option value="0.5">0.5×</option>
        <option value="1" selected>1×</option>
        <option value="2">2×</option>
        <option value="4">4×</option>
      </select>
    </div>
  </div>
  <script>window.LITTLEWORLD_NO_AUTOSTART = true;</script>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script>
  <script src="./showa-scene-clean.js?v=replay-20260828"></script>
  <script src="./replay.js?v=replay-20260828"></script>
</body>
</html>
