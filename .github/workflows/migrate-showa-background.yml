name: One-time Showa background migration

on:
  push:
    branches:
      - ai/gpt/normal-background-asset
    paths:
      - .github/workflows/migrate-showa-background.yml

permissions:
  contents: write

jobs:
  migrate-background:
    runs-on: ubuntu-latest

    steps:
      - name: Check out migration branch
        uses: actions/checkout@v4
        with:
          ref: ai/gpt/normal-background-asset
          fetch-depth: 0

      - name: Reconstruct normal WebP and update documentation
        shell: bash
        run: |
          python3 - <<'PY'
          from __future__ import annotations

          import base64
          import hashlib
          import shutil
          from pathlib import Path

          root = Path.cwd()
          fragment_dir = root / 'docs/assets/showa/clean'
          output = root / 'docs/assets/showa/scene-clean.webp'

          parts = [
              'part-00.txt',
              'part-01.txt',
              'part-02.txt',
              'part-03a.txt',
              'part-03b.txt',
              'part-04a.txt',
              'part-04b.txt',
              'part-05a.txt',
              'part-05b.txt',
              'part-06a.txt',
              'part-06b.txt',
              'part-07a.txt',
              'part-07b.txt',
              'part-08a.txt',
              'part-08b.txt',
          ]

          encoded = ''.join(
              (fragment_dir / name).read_text(encoding='utf-8')
              for name in parts
          )
          encoded = ''.join(encoded.split())
          raw = base64.b64decode(encoded, validate=True)

          expected_size = 51908
          expected_blob_sha = 'b56fc4aad45a3295997347482f44eeae647644f5'
          actual_blob_sha = hashlib.sha1(
              f'blob {len(raw)}\0'.encode('ascii') + raw
          ).hexdigest()

          if len(raw) != expected_size:
              raise SystemExit(
                  f'Unexpected WebP size: {len(raw)} != {expected_size}'
              )
          if raw[:4] != b'RIFF' or raw[8:12] != b'WEBP':
              raise SystemExit('Decoded background is not a WebP file')
          if actual_blob_sha != expected_blob_sha:
              raise SystemExit(
                  f'Unexpected Git blob SHA: {actual_blob_sha} != {expected_blob_sha}'
              )

          output.write_bytes(raw)
          shutil.rmtree(fragment_dir)

          def replace_once(path: str, old: str, new: str) -> None:
              target = root / path
              text = target.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise SystemExit(
                      f'Expected exactly one documentation match in {path}'
                  )
              target.write_text(text.replace(old, new), encoding='utf-8')

          replace_once(
              'README.md',
              'The current background is temporarily reconstructed from Base64 text fragments under `docs/assets/showa/clean/`. This was a binary-upload workaround and should eventually be replaced with a normal `.webp` or `.png` asset loaded directly by Phaser.',
              'The production background is a normal WebP asset at `docs/assets/showa/scene-clean.webp`, loaded directly by Phaser. The earlier Base64-fragment transport workaround has been removed from the active scene pipeline.',
          )
          replace_once(
              'README.md',
              '  assets/showa/clean/           Temporary encoded clean background',
              '  assets/showa/scene-clean.webp Production clean background (normal WebP asset)',
          )
          replace_once(
              'README.md',
              'Opening `docs/index.html` directly through `file://` is not recommended because the current background loader fetches asset fragments.',
              'Opening `docs/index.html` directly through `file://` is still not recommended; serve the page over HTTP so Phaser and browser asset loading behave consistently.',
          )
          replace_once(
              'README.md',
              '1. **Stabilize scene assets**\n   - keep the approved clean background complete and visible;\n   - replace the Base64-fragment workaround with a normal image asset when possible.',
              '1. **Stabilize scene assets**\n   - keep the approved clean WebP background complete and visible;\n   - preserve direct image loading, camera controls, and cache-busting.',
          )

          replace_once(
              'AGENTS.md',
              '**Last updated:** 2026-08-19 22:21 PT (`America/Los_Angeles`)',
              '**Last updated:** 2026-08-19 22:44 PT (`America/Los_Angeles`)',
          )
          replace_once(
              'AGENTS.md',
              'The current clean background is loaded as a **640 × 360 web-optimized image reconstructed from Base64 text fragments** in `docs/assets/showa/clean/`. This was an emergency transport workaround caused by binary-upload tooling. It is technical debt, not the intended asset architecture.\n\nThe preferred permanent architecture is a normal `.webp` or `.png` background file loaded directly by Phaser.',
              'The current clean background is a **640 × 360 web-optimized WebP** at `docs/assets/showa/scene-clean.webp`, loaded directly by Phaser.\n\nThe former Base64-fragment runtime loader has been removed. Future background replacements should remain normal `.webp` or `.png` assets.',
          )
          replace_once(
              'AGENTS.md',
              '- `docs/assets/showa/clean/` — temporary encoded background fragments',
              '- `docs/assets/showa/scene-clean.webp` — production clean background asset',
          )
          replace_once(
              'AGENTS.md',
              '- keep the approved clean background visible and complete;\n- replace the Base64-fragment workaround with a normal image asset when a reliable binary path is available;\n- remove only the obsolete workaround after direct-image loading is verified;\n- preserve pan, zoom, pinch, and Fit.',
              '- keep the approved clean background visible and complete;\n- preserve direct loading from `docs/assets/showa/scene-clean.webp`;\n- keep obsolete Base64-fragment loaders out of the active pipeline;\n- preserve pan, zoom, pinch, and Fit.',
          )
          PY

      - name: Commit generated WebP and cleanup
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- docs/assets/showa/scene-clean.webp
          git add --all -- docs/assets/showa/clean
          git add -- README.md AGENTS.md
          git commit -m 'scene: replace Base64 fragments with direct WebP asset'
          git push origin HEAD:ai/gpt/normal-background-asset
